version: "3.9"

# Docker Compose lee automáticamente el archivo .env de la misma carpeta.
# Copia .env.example como .env y completa los valores antes de levantar.

networks:
  bookflow-network:
    driver: bridge

volumes:
  auth-db-data:
  inventory-db-data:
  catalog-db-data:
  config-db-data:
  pricing-db-data:

services:

  # ─────────────────────────────────────────
  # BASES DE DATOS (una por servicio)
  # ─────────────────────────────────────────
  auth-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_NAME_AUTH}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - bookflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  inventory-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_NAME_INVENTORY}
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    networks:
      - bookflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalog-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_NAME_CATALOG}
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    networks:
      - bookflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  config-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_NAME_CONFIG}
    volumes:
      - config-db-data:/var/lib/postgresql/data
    networks:
      - bookflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  pricing-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_NAME_PRICING}
    volumes:
      - pricing-db-data:/var/lib/postgresql/data
    networks:
      - bookflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # MICROSERVICIOS BACKEND
  # ─────────────────────────────────────────
  auth-service:
    build: ./auth-service
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@auth-db:5432/${DB_NAME_AUTH}
      SECRET_KEY: ${JWT_SECRET_KEY}
      ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - bookflow-network
    restart: always

  inventory-service:
    build: ./inventory-service
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@inventory-db:5432/${DB_NAME_INVENTORY}
    depends_on:
      inventory-db:
        condition: service_healthy
    networks:
      - bookflow-network
    restart: always

  catalog-service:
    build: ./catalog-service
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@catalog-db:5432/${DB_NAME_CATALOG}
    depends_on:
      catalog-db:
        condition: service_healthy
    networks:
      - bookflow-network
    restart: always

  enrichment-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_NAME_ENRICHMENT:-enrichment_db}
    volumes:
      - enrichment-db-data:/var/lib/postgresql/data
    networks:
      - bookflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  pricing-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_NAME_PRICING:-pricing_db}
    volumes:
      - pricing-db-data:/var/lib/postgresql/data
    networks:
      - bookflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-enrichment-mock:
    build: ./ai-enrichment-mock
    ports:
      - "8006:8006"
    networks:
      - bookflow-network
    restart: on-failure

  ai-enrichment-service:
    build: ./ai-enrichment-service
    ports:
      - "8004:8004"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@enrichment-db:5432/${DB_NAME_ENRICHMENT:-enrichment_db}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      OPEN_LIBRARY_BASE_URL: https://openlibrary.org
      CROSSREF_BASE_URL: https://api.crossref.org
      CATALOG_SERVICE_URL: http://catalog-service:8003
      SERVICE_PORT: 8004
    depends_on:
      enrichment-db:
        condition: service_healthy
      catalog-service:
        condition: service_started
    networks:
      - bookflow-network
    restart: always

  pricing-service:
    build: ./pricing-service
    ports:
      - "8005:8005"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pricing-db:5432/${DB_NAME_PRICING:-pricing_db}
      EBAY_APP_ID: ${EBAY_APP_ID:-}
      EBAY_BASE_URL: https://api.ebay.com/buy/browse/v1
      CATALOG_SERVICE_URL: http://catalog-service:8003
      INVENTORY_SERVICE_URL: http://inventory-service:8002
      SERVICE_PORT: 8005
    depends_on:
      pricing-db:
        condition: service_healthy
    networks:
      - bookflow-network
    restart: always

  data-quality-module:
    build: ./data-quality-module
    ports:
      - "8007:8007"
    environment:
      INVENTORY_SERVICE_URL: http://inventory-service:8002
    depends_on:
      - inventory-service
    networks:
      - bookflow-network
    restart: on-failure

  config-module:
    build: ./config-module
    ports:
      - "8008:8008"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@config-db:5432/${DB_NAME_CONFIG}
    depends_on:
      config-db:
        condition: service_healthy
    networks:
      - bookflow-network
    restart: always

  pricing-service:
    build: ./pricing-service
    ports:
      - "8005:8005"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pricing-db:5432/${DB_NAME_PRICING}
      EBAY_APP_ID: ${EBAY_APP_ID}
    depends_on:
      pricing-db:
        condition: service_healthy
    networks:
      - bookflow-network
    restart: on-failure

  bff-gateway:
    build: ./bff-gateway
    ports:
      - "8009:8009"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8001
      INVENTORY_SERVICE_URL: http://inventory-service:8002
      CATALOG_SERVICE_URL: http://catalog-service:8003
      AI_ENRICHMENT_URL: http://ai-enrichment-mock:8006
      ENRICHMENT_SERVICE_URL: http://ai-enrichment-service:8004
      PRICING_SERVICE_URL: http://pricing-service:8005
      DATA_QUALITY_URL: http://data-quality-module:8007
      CONFIG_MODULE_URL: http://config-module:8008
      PRICING_SERVICE_URL: http://pricing-service:8005
    depends_on:
      - auth-service
      - inventory-service
      - catalog-service
      - ai-enrichment-mock
      - ai-enrichment-service
      - pricing-service
      - data-quality-module
      - config-module
      - pricing-service
    networks:
      - bookflow-network
    restart: on-failure

  # ─────────────────────────────────────────
  # FRONTENDS
  # ─────────────────────────────────────────
  admin-frontend:
    build: ./admin-frontend
    ports:
      - "3001:3001"
    environment:
      VITE_BFF_URL: ${VITE_BFF_URL}
    depends_on:
      - bff-gateway
    networks:
      - bookflow-network

  commercial-frontend:
    build: ./commercial-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_BFF_URL: ${VITE_BFF_URL}
    depends_on:
      - bff-gateway
    networks:
      - bookflow-network
